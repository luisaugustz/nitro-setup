# This content was generated by nwg-shell-config. Do not modify it manually.

# VARIABLES
$term = foot
$browser = firefox
$filemanager = thunar
$editor = kwrite
$launcher = nwg-drawer
$exit = $launcher

# AUTOSTART
exec-once = swaync -c /home/luis/.config/swaync/hyprland.json -s /home/luis/.config/swaync/hyprland-1.css
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec = nwg-drawer -r -c 6 -is 64 -fscol 2 -g Material-Black-Mango-BE -i Material-Black-Mango-BE -s hyprland-1.css -term kitty -ft -wm hyprland -pbexit 'nwg-dialog -p exit-hyprland -c "hyprctl dispatch exit"' -pblock 'hyprlock' -pbpoweroff 'nwg-dialog -p poweroff -c "systemctl -i poweroff"' -pbreboot 'nwg-dialog -p reboot -c "systemctl reboot"' -pbsleep 'nwg-dialog -p sleep -c "systemctl suspend"' -pbsize 48
exec = nwg-panel -c hyprland-1 -s hyprland-1.css
exec = nwg-dock-hyprland -d -p bottom -l overlay -a center -i 48 -hd 20 -s hyprland-1.css
exec-once = hypridle
exec-once = nwg-update-indicator
exec = nwg-screenshot-applet

# GENERAL SETTINGS
general {
    border_size = 3
    gaps_in = 3
    gaps_out = 3
    col.active_border = rgba(ff8800ee) rgba(ffaa00ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# DWINDLE LAYOUT 
dwindle {
    force_split = 0
    preserve_split = true
    smart_split = false
    smart_resizing = true
    special_scale_factor = 0.8
    split_width_multiplier = 1.0
    use_active_for_splits = true
    default_split_ratio = 1.0
}

# MASTER LAYOUT 
master {
    allow_small_split = false
    special_scale_factor = 0.8
    mfact = 0.55
    new_status = slave
    orientation = left
    slave_count_for_center_master = 2
}

# INPUT DEVICES
input {
    kb_layout = us
    kb_variant = intl
    numlock_by_default = true
    repeat_rate = 25
    repeat_delay = 600
    sensitivity = -1.0
    follow_mouse = 1
    mouse_refocus = true
    float_switch_override_focus = 1
    touchpad {
        disable_while_typing = true
        scroll_factor = 1.0
        tap-to-click = true
    }
}

# MISC SETTINGS
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    mouse_move_enables_dpms = false
    key_press_enables_dpms = false
    layers_hog_keyboard_focus = true
    focus_on_activate = false
}

# KEY BINDINGS
bindr = SUPER, SUPER_L, exec, $launcher

# LAYER RULES
# layerrule = blur true, nwg-drawer  # TODO: fix blur syntax for 0.54
