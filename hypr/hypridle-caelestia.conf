general {
    lock_cmd = /home/luis/.config/hypr/caelestia-lock.sh   # lock nativo do Caelestia
    before_sleep_cmd = loginctl lock-session               # dispara lock_cmd uma vez
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session                     # -> lock_cmd (caelestia:lock)
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
