general {
    lock_cmd = /home/luis/.config/hypr/lock.sh   # hyprlock + cura a barra (nwg-panel) ao destravar
    before_sleep_cmd = loginctl lock-session      # dispara lock_cmd uma vez, sem duplicar
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session            # -> lock_cmd (hyprlock), sem sortear wallpaper
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
