# =============================================================================
# settings.conf — configuração AGNÓSTICA de shell (vale pro nwg e pro caelestia)
# Extraído do includes.conf (gerado pelo nwg-shell-config) para desacoplar do shell.
# Trocar de shell NÃO mexe aqui. Ver shell-active.conf (symlink) para o shell ativo.
# =============================================================================

# --- VARIÁVEIS DE APPS (agnósticas) ---
$term = foot
$browser = firefox
$filemanager = thunar
$editor = kwrite

# --- AUTOSTART COMPARTILHADO (vale pros dois shells) ---
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- GENERAL ---
general {
    border_size = 3
    gaps_in = 3
    gaps_out = 3
    col.active_border = rgba(ef8450ee) rgba(f2a15fee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# --- DWINDLE ---
dwindle {
    force_split = 0
    preserve_split = true
    smart_split = false
    smart_resizing = true
    special_scale_factor = 0.8
    split_width_multiplier = 1.0
    use_active_for_splits = true
    default_split_ratio = 1.0
}

# --- MASTER ---
master {
    allow_small_split = false
    special_scale_factor = 0.8
    mfact = 0.55
    new_status = slave
    orientation = left
    slave_count_for_center_master = 2
}

# --- INPUT ---
input {
    kb_layout = us
    kb_variant = intl
    numlock_by_default = true
    repeat_rate = 25
    repeat_delay = 600
    sensitivity = 0
    accel_profile = flat
    follow_mouse = 1
    mouse_refocus = true
    float_switch_override_focus = 1
    touchpad {
        disable_while_typing = true
        scroll_factor = 1.0
        tap-to-click = true
    }
}

# --- MISC ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    layers_hog_keyboard_focus = true
    focus_on_activate = false
}
