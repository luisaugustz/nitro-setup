# =============================================================================
# shell-caelestia.conf — stack Caelestia Shell (Quickshell)
# Ativado via symlink shell-active.conf -> este arquivo. Trocar: shell-switch.sh
# Sourced no FIM do hyprland.conf, então os binds daqui têm prioridade.
# =============================================================================

$launcher = caelestia shell -d

# --- AUTOSTART ---
exec-once = caelestia shell -d
exec-once = hypridle -c ~/.config/hypr/hypridle-caelestia.conf
# Wallpaper: o shell restaura o último wallpaper automaticamente ao subir.
# Para definir: caelestia wallpaper -f /caminho/img.jpg   (extrai o color scheme)

# --- LAUNCHER ---
# Toque no Super abre o launcher. O anti-vazamento (Super+C não abrir o launcher)
# vem do caelestia-launcher-interrupt.conf: cada combo com Super dispara também
# caelestia:launcherInterrupt, então só o toque PURO do Super chega no release limpo.
bindr = SUPER, SUPER_L, global, caelestia:launcher       # toque no Super
bind  = SUPER, R,       global, caelestia:launcher       # Super+R (redundante)
bind  = SUPER, Tab,     cyclenext                        # troca de janela (era rofi -show window)
source = ~/.config/hypr/caelestia-launcher-interrupt.conf

# --- SESSÃO / LOCK / NOTIFICAÇÕES ---
bind = SUPER, X,      global, caelestia:session          # menu de sessão/power (era $exit nwg)
bind = SUPER, Escape, global, caelestia:session
bind = SUPER, L,      global, caelestia:lock             # lock nativo do Caelestia
bind = SUPER, N,      global, caelestia:clearNotifs      # limpa notificações

# --- CLIPBOARD / EMOJI ---
bind = ALT,   C,      exec, pkill fuzzel || caelestia clipboard    # (era nwg-clipman)
bind = SUPER, Period, exec, pkill fuzzel || caelestia emoji -p

# --- MÍDIA (OSD do Caelestia) ---
bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop

# --- BRILHO (OSD do Caelestia) ---
bindl = , XF86MonBrightnessUp,   global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# --- SCREENSHOT ---
bind = , Print,        exec, caelestia screenshot          # tela cheia
bind = SUPER, Print,   global, caelestia:screenshot        # seleção de região
bind = CONTROL, Print, exec, caelestia screenshot -f       # freeze

# --- GRAVAÇÃO DE TELA (gpu-screen-recorder; salva em ~/Videos/Recordings) ---
# `caelestia record` é TOGGLE: 1x começa (monitor focado), 2x para e salva.
bind = CONTROL ALT, R,       exec, caelestia record            # start/stop monitor focado
bind = CONTROL ALT SHIFT, R, exec, caelestia record -r -s      # region (slurp) + áudio
bind = CONTROL ALT, P,       exec, caelestia record -p         # pausa/resume

# Extras disponíveis (descomente se quiser bindar; teclas A/S/D estão livres p/ layout):
# bind = SUPER, D, global, caelestia:showall     # dashboard (COLIDE com master cyclenext atual!)
# bind = SUPER, B, global, caelestia:sidebar      # sidebar
