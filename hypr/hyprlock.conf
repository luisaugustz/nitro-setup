# hyprlock — substitui nwg-lock/gtklock (que sorteava wallpaper a cada launch
# e empilhava instancias). hyprlock e idempotente: um segundo hyprlock recusa
# iniciar enquanto um ja roda, entao nao ha loop de relock nem troca de fundo.

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

# Fundo fixo (o mesmo wallpaper do desktop, sem ciclar)
background {
    monitor =
    path = /usr/share/backgrounds/nwg-shell/edskeye-2.jpg
    blur_passes = 2
    blur_size = 5
    brightness = 0.7
}

# Relogio
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = sans-serif
    position = 0, 220
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(255, 255, 255, 0.75)
    font_size = 22
    font_family = sans-serif
    position = 0, 130
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(20, 20, 25, 0.75)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    placeholder_text = <i>Senha…</i>
    check_color = rgba(120, 200, 140, 1.0)
    fail_color = rgba(220, 90, 90, 1.0)
    fail_text = <i>Senha incorreta ($ATTEMPTS)</i>
    position = 0, -50
    halign = center
    valign = center
}
