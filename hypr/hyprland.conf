# nwg-shell Hyprland config file
#
# The nwg-shell-config utility generates a part of settings for you:
# General, Input devices, Touchpad, Dwindle layout, Master layout.
# Decoration, animations, gestures and per-device config are left to be configured by yourself.
# Refer to the Hyprland wiki at https://wiki.hyprland.org for more information.

#
# Monitors & workspaces: nwg-displays generates 2 files, which we include here:
#
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

#
# Autostart. Feel free to add your own entries.
# Shell components will be started in the includes.conf file, which we include below.
#
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = ~/.azotebg-hyprland   # wallpaper agora é gerenciado pelo shell (ver shell-active.conf)
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = xauth generate :0 . trusted
exec-once = spotify & firefox & steam &
exec-once = easyeffects --gapplication-service &
exec-once = mullvad-vpn &
exec-once = wljoywake                               # prevent idle/lock when using gamepad
exec-once = openrgb --device 0 --mode off && openrgb --device 1 --mode off

#
# Settings do compositor (agnósticos de shell) — extraídos do antigo includes.conf.
# O includes.conf original fica no disco intacto (referência/rollback), mas NÃO é
# mais sourced: quem manda agora é settings.conf + o shell ativo (shell-active.conf).
#
source = ~/.config/hypr/settings.conf

#
# All the settings below are up to you. We don't touch them in the shell config utility.
#

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
         enabled = true
         size = 6
         passes = 3
         new_optimizations = true
         xray = true
         ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    # Beziers fluidos (estilo "overshoot" com leve bounce)
    bezier = wind,       0.05, 0.9,  0.1,  1.05
    bezier = winIn,      0.1,  1.1,  0.1,  1.1
    bezier = winOut,     0.3, -0.3,  0,    1
    bezier = liner,      1,    1,    1,    1
    bezier = overshot,   0.05, 0.9,  0.1,  1.1
    bezier = smoothOut,  0.36, 0,    0.66, -0.56
    bezier = smoothIn,   0.25, 1,    0.5,  1
    # overshoot forte = bounce
    bezier = bounce,     0.2,  1.6,  0.25, 1.0
    bezier = snappy,     0.3,  1.3,  0.2,  1.0

    animation = windows,        1, 5,  bounce,   popin 85%
    animation = windowsIn,      1, 5,  bounce,   popin 80%
    animation = windowsOut,     1, 5,  smoothOut,popin 80%
    animation = windowsMove,    1, 5,  snappy,   slide
    animation = border,         1, 1,  liner
    animation = borderangle,    1, 30, liner,    loop
    animation = fade,           1, 8,  smoothIn
    animation = workspaces,     1, 5,  overshot, slidefade 20%
    animation = specialWorkspace, 1, 5, overshot, slidefade 20%
    animation = layers,         1, 4,  bounce,   popin 70%
    animation = layersIn,       1, 4,  snappy,   popin 60%
    animation = layersOut,      1, 4,  smoothOut,popin 80%
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic-mouse-v1 {
#     sensitivity = -0.5
# }


# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# KEY BINDINGS, see https://wiki.hyprland.org/Configuring/Binds/ for more
# If you happen to change some key bindings, you may also edit ~/.local/share/nwg-shell-config/help-hyprland.pango

# We've defined $term, $editor and so on in includes.conf.
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $editor
bind = $mainMod, F, exec, $filemanager
bind = $mainMod, T, exec, $term
bind = $mainMod, F2, exec, $term
# Binds shell-específicos (X=sessão, ALT+F1=launcher, ALT+C=clipboard) -> shell-active.conf

# Toggle do dock -> shell-active.conf (nwg-dock só existe no stack nwg)

# Lock ($mainMod L) e help -> shell-active.conf

bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, I, pin
bind = $mainMod, C, killactive,
bind = ALT, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, Space, togglefloating,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/reload.sh   # reload Hyprland + religa hypridle
bind = $mainMod SHIFT, Z, movetoworkspace, special  # move to the special workspace
bind = $mainMod, Z, togglespecialworkspace          # show/hide special workspace

bind = ALT, Tab, layoutmsg, togglesplit             # (dwindle)
bind = $mainMod, P, pseudo,                         # (dwindle)
bind = $mainMod, A, layoutmsg, cycleprev            # (master)
bind = $mainMod, S, layoutmsg, swapwithmaster       # (master)
bind = $mainMod, D, layoutmsg, cyclenext            # (master)

# SCREENSHOT -> shell-active.conf (caelestia screenshot / script nwg)


# SWITCH WORKSPACES with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Media Controls -> shell-active.conf (OSD caelestia / playerctl nwg)


# MOVE ACTIVE WINDOW TO A WORKSPACE with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# SCROLL THROUGH EXISTING WORKSPACES with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# MOVE/RESIZE WINDOWS with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#
# HUD MESSAGES (must be defined after primary bindings).
# In case you find them annoying, delete the line below.
# You can also delete the ~/.config/hypr/hud.conf file afterwards.
#
# source = ~/.config/hypr/hud.conf   # nwg-hud: movido p/ shell-nwg.conf (só no stack nwg)

bind = SUPER SHIFT, B, exec, wtype "$(wl-paste)"

windowrule = tag +game, match:class steam_app_252950
windowrule = immediate on, match:tag game

#
# =============================================================================
# SHELL ATIVO — symlink shell-active.conf aponta para shell-caelestia.conf
# ou shell-nwg.conf. Trocar: ~/.config/hypr/shell-switch.sh {caelestia|nwg}
# Sourced por ÚLTIMO de propósito: os binds/execs do shell têm prioridade.
# =============================================================================
source = ~/.config/hypr/shell-active.conf

# HyprMod managed settings
source = /home/luis/.config/hypr/hyprland-gui.conf
