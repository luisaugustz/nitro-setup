# =============================================================================
# shell-nwg.conf — stack nwg-shell ORIGINAL (rollback / "nukar de volta")
# Reconstrói o autostart + binds que antes viviam em includes.conf e hyprland.conf.
# Ativar: shell-switch.sh nwg   (aponta shell-active.conf -> este arquivo)
# Sourced no FIM do hyprland.conf, então os binds daqui têm prioridade.
# =============================================================================

$launcher = rofi -show drun -theme grid
$exit = nwg-drawer

# --- AUTOSTART (nwg-shell) ---
exec-once = swaync -c /home/luis/.config/swaync/hyprland.json -s /home/luis/.config/swaync/hyprland-1.css
exec = nwg-drawer -r -c 6 -is 64 -fscol 2 -g Material-Black-Mango-BE -i Material-Black-Mango-BE -s hyprland-1.css -term kitty -ft -wm hyprland -pbexit 'nwg-dialog -p exit-hyprland -c "hyprctl dispatch exit"' -pblock 'hyprlock' -pbpoweroff 'nwg-dialog -p poweroff -c "systemctl -i poweroff"' -pbreboot 'nwg-dialog -p reboot -c "systemctl reboot"' -pbsleep 'nwg-dialog -p sleep -c "systemctl suspend"' -pbsize 48
exec = nwg-panel -c hyprland-1 -s hyprland-1.css
exec = nwg-dock-hyprland -d -p bottom -l overlay -a center -i 48 -hd 20 -s hyprland-1.css
exec-once = hypridle
exec-once = nwg-update-indicator
exec = nwg-screenshot-applet
exec-once = ~/.azotebg-hyprland   # wallpaper (azote)

# --- LAUNCHER (rofi override do nwg-drawer) ---
bindr = SUPER, SUPER_L, exec, pkill rofi || rofi -show drun -theme grid
bind  = SUPER, R,   exec, pkill rofi || rofi -show drun -theme grid
bind  = SUPER, Tab, exec, pkill rofi || rofi -show window
bind  = ALT, F1,    exec, pkill rofi || rofi -show drun -theme grid
bind  = SUPER, X,   exec, $exit

# --- DOCK / CLIPBOARD ---
bind = ALT, D, exec, pkill -10 nwg-dock   # show/hide do dock
bind = ALT, C, exec, nwg-clipman

# --- LOCK / HELP ---
bind = SUPER, L,  exec, loginctl lock-session   # hyprlock via hypridle lock_cmd (lock.sh)
bind = SUPER, F1, exec, nwg-shell-help

# --- MÍDIA (playerctl) ---
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# --- SCREENSHOT (script /usr/local/bin/screenshot) ---
bind = , Print,                     exec, screenshot fullscreen
bind = CONTROL, Print,              exec, screenshot display
bind = SUPER SHIFT+CONTROL, Print,  exec, screenshot focused
bind = SHIFT+CONTROL, Print,        exec, screenshot swappy

# --- ROFI layerrules ---
layerrule = blur true, match:namespace rofi
layerrule = ignore_alpha 0.5, match:namespace rofi
layerrule = animation popin 80%, match:namespace rofi

# --- HUD de workspace (nwg-hud) ---
source = ~/.config/hypr/hud.conf
